[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: tests that exercise timing or concurrency",
]

[tool.ruff]
line-length = 95
target-version = "py312"
exclude = [".venv", "*/migrations/*", "staticfiles", "media"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # DRF and Django idioms call functions in defaults
    "SIM105", # contextlib.suppress reads worse in short except blocks
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]
