# Edge config for the API.
#
# The two things that matter here: websockets need the Upgrade headers passed
# through and no read timeout, and uploaded art should be served by nginx
# rather than occupying a Python worker.

upstream biblegolf_api {
    # Docker's internal DNS resolves `api` to every replica.
    server api:8000;
    keepalive 32;
}

server {
    listen 8000;
    server_name _;

    client_max_body_size 6m;   # card art is capped at 5MB server-side

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /healthz {
        proxy_pass http://biblegolf_api;
        access_log off;
    }

    # A websocket is a long-lived connection: the hop-by-hop upgrade headers
    # have to be forwarded explicitly, and the read timeout has to be long
    # enough that a table sitting quietly between turns isn't hung up on.
    location /ws/ {
        proxy_pass http://biblegolf_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://biblegolf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
