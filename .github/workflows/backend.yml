name: Backend

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: biblegolf
          POSTGRES_USER: biblegolf
          POSTGRES_PASSWORD: biblegolf
        options: >-
          --health-cmd "pg_isready -U biblegolf"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt -r requirements/prod.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (SQLite)
        run: pytest --cov --cov-report=term-missing

      - name: Tests (PostgreSQL + Redis)
        env:
          DATABASE_URL: postgres://biblegolf:biblegolf@localhost:5432/biblegolf
          REDIS_URL: redis://localhost:6379/0
          USE_REDIS: "true"
        run: pytest --ds=config.settings.dev

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-secret-key-long-enough-to-pass-the-check
          DJANGO_ALLOWED_HOSTS: api.example.com
          DATABASE_URL: postgres://biblegolf:biblegolf@localhost:5432/biblegolf
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py spectacular --file /dev/null

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t biblegolf-api:${{ github.sha }} .
